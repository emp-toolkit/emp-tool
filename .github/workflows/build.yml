name: build
on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC Debug portable
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            shared: OFF
            native: OFF
            hash: sha256
            fs_hash: default
          - name: Ubuntu GCC Release portable
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            shared: OFF
            native: OFF
            hash: sha256
            fs_hash: default
          - name: Ubuntu Clang shared BLAKE3
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            shared: ON
            native: OFF
            hash: blake3
            fs_hash: default
          - name: Ubuntu GCC split hash policy
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            shared: OFF
            native: OFF
            hash: sha256
            fs_hash: blake3
          - name: Ubuntu GCC native ISA
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            shared: OFF
            native: ON
            hash: sha256
            fs_hash: default
          - name: Ubuntu arm64 GCC portable
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            build_type: Release
            shared: OFF
            native: OFF
            hash: sha256
            fs_hash: default
          - name: macOS AppleClang portable
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            shared: OFF
            native: OFF
            hash: sha256
            fs_hash: default
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DEMP_TOOL_NATIVE_ARCH=${{ matrix.native }}
          -DEMP_HASH_BACKEND=${{ matrix.hash }}
          -DEMP_FS_HASH=${{ matrix.fs_hash }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 150
      - name: Reject invalid hash backend
        if: matrix.name == 'Ubuntu GCC Release portable'
        run: |
          if cmake -S . -B build-invalid-hash \
              -DEMP_TOOL_BUILD_TESTS=OFF \
              -DEMP_TOOL_BUILD_TOOLS=OFF \
              -DEMP_HASH_BACKEND=invalid; then
            echo "invalid EMP_HASH_BACKEND was accepted" >&2
            exit 1
          fi

  # Linux Clang owns the sanitizer leg so both major compiler families are
  # continuously exercised. Alignment checking remains enabled.
  sanitize:
    name: ASan + UBSan (Ubuntu Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DEMP_TOOL_NATIVE_ARCH=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test (ASan + UBSan)
        run: ctest --test-dir build-san --output-on-failure --timeout 150
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Release-package smoke: install emp-tool to a prefix, then build and run an
  # external find_package(emp-tool) consumer against the install (default
  # SHA-256 backend, and Clang/shared + BLAKE3 to cover the other backend axis).
  install-consume:
    name: Install + consume (find_package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static SHA-256
            args: ""
          - name: shared BLAKE3
            args: "-DBUILD_SHARED_LIBS=ON -DEMP_WITH_BLAKE3=ON -DEMP_HASH_BACKEND=blake3"
    steps:
      - uses: actions/checkout@v6
      - name: Install emp-tool, then build + run a find_package consumer
        run: bash test/install_consumer/run.sh "$PWD" ${{ matrix.args }}
